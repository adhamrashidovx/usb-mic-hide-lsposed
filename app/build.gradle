plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.usbmichide'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.usbmichide'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Stub only: the real Xposed API is provided by LSPosed/Vector at runtime.
    compileOnly project(':xposedstub')
}
